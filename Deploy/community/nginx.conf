limit_req_zone $binary_remote_addr zone=luma_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=luma_connections:10m;
log_format luma_safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name lumastudio.47-100-139-168.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/luma-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name lumastudio.47-100-139-168.sslip.io;
    ssl_certificate /etc/letsencrypt/live/lumastudio.47-100-139-168.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumastudio.47-100-139-168.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    access_log /var/log/nginx/luma-community.access.log luma_safe;
    error_log /var/log/nginx/luma-community.error.log;
    client_max_body_size 12m;
    client_body_timeout 20s;
    limit_req zone=luma_requests burst=30 nodelay;
    limit_conn luma_connections 15;
    limit_req_status 429;
    location / {
        proxy_pass http://127.0.0.1:18791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
