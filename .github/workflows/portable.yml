name: Android and Windows Release
on:
  push:
    branches: [main, 'opencat/**']
    paths:
      - 'Apps/LumaStudioCross/**'
      - '.github/workflows/portable.yml'
      - 'Scripts/package_windows.ps1'
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_REVISION: ab2912035e160d9cad6306df307576da6128ebdb
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ((git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD) -ne $env:FLUTTER_REVISION) { throw 'Flutter revision mismatch' }
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP/flutter/bin/flutter.bat" config --no-analytics
      - name: Native Release build and pixel checks
        run: |
          cmake -S Apps/LumaStudioCross/packages/luma_native/src -B native-build -DLUMA_BUILD_TESTS=ON
          cmake --build native-build --config Release --parallel 4
          ctest --test-dir native-build -C Release --output-on-failure
          "LUMA_NATIVE_LIBRARY=$env:GITHUB_WORKSPACE/native-build/Release/luma_native.dll" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Analyze and run workflow and layout tests
        working-directory: Apps/LumaStudioCross
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build Windows x64 Release
        working-directory: Apps/LumaStudioCross
        run: flutter build windows --release
      - name: Exercise the actual Windows editor window
        working-directory: Apps/LumaStudioCross
        run: |
          Remove-Item Env:LUMA_NATIVE_LIBRARY -ErrorAction SilentlyContinue
          flutter test integration_test/editor_test.dart -d windows --verbose 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-ui-test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-UI-validation-log
          path: ${{ runner.temp }}/windows-ui-test.log
          if-no-files-found: ignore
      - name: Run the compiled Windows application self-test
        run: |
          Remove-Item Env:LUMA_NATIVE_LIBRARY -ErrorAction SilentlyContinue
          $exe = "$env:GITHUB_WORKSPACE/Apps/LumaStudioCross/build/windows/x64/runner/Release/lumastudio.exe"
          $fixture = "$env:RUNNER_TEMP/luma-release-test"
          $report = "$env:GITHUB_WORKSPACE/Artifacts/windows-release-self-test.json"
          New-Item -ItemType Directory -Force -Path "$fixture/raw" | Out-Null
          Invoke-WebRequest -Uri 'https://raw.pixls.us/getfile.php/131/nice/Canon%20-%20EOS%207D%20-%20RAW%20%283:2%29.CR2' -OutFile "$fixture/raw/佳能.CR2" -MaximumRetryCount 3
          Invoke-WebRequest -Uri 'https://raw.pixls.us/getfile.php/865/nice/Fujifilm%20-%20X-T2%20-%2014bit%2014bit%20compressed%20%283:2%29.RAF' -OutFile "$fixture/raw/富士.RAF" -MaximumRetryCount 3
          if ((Get-FileHash "$fixture/raw/佳能.CR2" -Algorithm SHA256).Hash -ne 'B5E47C5FCF7332AC03E0134926F17A338A42E68C1FD7F83E16F45F4B767544E8') { throw 'Canon fixture checksum mismatch' }
          if ((Get-FileHash "$fixture/raw/富士.RAF" -Algorithm SHA256).Hash -ne 'F756AD5BE551A8B3E1B503A8A6F7E8E637FBA519C0B0F8C79DD58E94B0287602') { throw 'Fuji fixture checksum mismatch' }
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', $fixture, $report) -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw "Release execution failed: $($process.ExitCode)" }
          if (!(Get-Content $report -Raw | ConvertFrom-Json).success) { throw 'Release workflow checks failed' }
      - name: Package Windows with required runtime files
        run: ./Scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LumaStudio-Windows-x64-Release
          path: |
            Deliverables/Release-0.5.0/LumaStudio-0.5.0-Windows-x64.zip
            Artifacts/windows-release-self-test.json
            Artifacts/windows-editor-ui.png
            Artifacts/Performance/portable-local-self-test.json
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned official Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
      - name: Resolve and build optimized Android APK
        working-directory: Apps/LumaStudioCross
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: LumaStudio-Android-unsigned
          path: Apps/LumaStudioCross/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
