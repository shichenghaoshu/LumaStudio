name: lumastudio
description: LumaStudio local photo editor for Android and Windows.
publish_to: none
version: 0.5.0+9
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  luma_native:
    path: packages/luma_native
  image: ^4.12.0
  file_picker: ^13.3.3
  file_selector: ^1.0.4
  path_provider: ^2.1.6
  path: ^1.9.1
  ffi: ^2.1.4
  crypto: ^3.0.7
  archive: ^4.0.7
  share_plus: ^13.3.1
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/filters/
    - assets/demo.jpg
    - assets/licenses/
  fonts:
    - family: LumaUI
      fonts:
        - asset: assets/fonts/LumaUI-Regular.ttf
