<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光 · 创作中心</title><link rel="icon" type="image/png" href="/shiguang-mark.png"><link rel="stylesheet" href="/style.css"></head><body>
<aside><div class="brand"><img class="brand-mark" src="/shiguang-mark.png" width="38" height="38" alt="拾光商标"><div>拾光<small>创作中心</small></div></div><nav aria-label="创作中心导航"><button class="nav active" data-nav="explore">发现作品<span>01</span></button><button class="nav" data-nav="favorites">我的收藏<span>02</span></button><button class="nav" data-nav="mine">我的作品<span>03</span></button><button class="nav" data-nav="following">关注动态<span>04</span></button><button class="nav" data-nav="installed">已安装<span>05</span></button></nav><button id="create" class="publish">＋ 发布作品</button><div class="side-bottom"><button id="account">登录 / 成为创作者</button><p id="community-storage">本机社区 · 数据保存在本地<br>商业收款与分账尚未接通</p><a href="https://github.com/shichenghaoshu/LumaStudio" target="_blank" rel="noreferrer">开发者协议 ↗</a></div></aside>
<main><header><div><span class="eyebrow">CREATOR WORKSPACE</span><h1 id="page-title">发现作品</h1></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索风格、工具或创作者" maxlength="120" aria-label="搜索作品"></label><button id="refresh" class="quiet">刷新</button></header>
<div class="filters"><div id="kinds" role="group" aria-label="插件类型"><button class="active" data-kind="">全部</button><button data-kind="lut">LUT</button><button data-kind="recipe">调色配方</button><button data-kind="localAdjustment">局部工具</button><button data-kind="aiTool">AI 工具</button></div><select id="sort" aria-label="排序"><option value="recent">最近更新</option><option value="rating">评分优先</option><option value="downloads">下载优先</option></select></div>
<div id="notice" role="status" aria-live="polite"></div><div class="workspace"><div class="catalog-column"><section id="results" aria-label="作品列表"><p class="empty">正在读取作品…</p></section><div id="pagination" class="pagination" hidden><button id="previous-page" class="quiet">上一页</button><span id="page-status" role="status"></span><button id="next-page" class="quiet">下一页</button></div></div><section id="detail" aria-label="作品详情"><div class="empty-detail"><span>◈</span><h2>选择一个作品</h2><p>摄影师的风格、调色师的配方、开发者的工具。</p></div></section></div></main>
<dialog id="auth-dialog"><form id="auth-form"><div class="dialog-head"><h2 id="auth-title">登录创作中心</h2><button type="button" class="close" data-close="auth-dialog" aria-label="关闭登录">×</button></div><label>账号<input name="id" required pattern="[a-z][a-z0-9_-]{2,39}" autocomplete="username" placeholder="3–40 位小写字母、数字或下划线"></label><label id="name-label" hidden>昵称<input name="name" maxlength="80" autocomplete="nickname"></label><label>密码<input name="password" type="password" required minlength="10" maxlength="256" autocomplete="current-password"></label><fieldset id="roles" hidden><legend>你的创作身份</legend><label><input type="checkbox" name="role" value="photographer" checked>摄影师</label><label><input type="checkbox" name="role" value="colorist">调色师</label><label><input type="checkbox" name="role" value="developer">开发者</label></fieldset><p id="auth-error" class="error" role="alert"></p><button class="primary" id="auth-submit">登录</button><button type="button" id="auth-mode" class="quiet">创建创作者账号</button><p id="account-storage" class="hint">账号与密码摘要保存在本机社区服务，不会同步到云端。</p></form></dialog>
<dialog id="publish-dialog"><form id="publish-form"><div class="dialog-head"><div><span class="eyebrow">CONTRIBUTE</span><h2>发布你的作品</h2></div><button type="button" class="close" data-close="publish-dialog" aria-label="关闭发布">×</button></div><label>导入内容<input type="file" id="package-file" accept=".lumaplugin,.cube,.json"></label><p id="file-status" class="hint">可直接上传 .lumaplugin，或把 CUBE、v2 配方、局部蒙版转成插件。</p><button type="button" id="current-recipe" class="quiet">使用 Mac 当前配方</button><div id="wizard"><div class="two"><label>作品名称<input name="title" required maxlength="80" placeholder="例如：午后暖光人像"></label><label>插件类型<select name="kind"><option value="lut">LUT</option><option value="recipe">调色配方</option><option value="localAdjustment">局部处理工具</option><option value="aiTool">AI 修图工具</option></select></label></div><div class="two"><label>唯一 ID<input name="pluginID" required pattern="[a-z][a-z0-9]*(?:[.-][a-z0-9]+){1,7}" placeholder="yourname.warm-light"></label><label>版本<input name="version" value="1.0.0" required pattern="[0-9]+\.[0-9]+\.[0-9]+"></label></div><label>作品说明<textarea name="summary" required maxlength="600" rows="2" placeholder="描述效果、适用照片和限制"></textarea></label><label>标签<input name="tags" placeholder="人像, 胶片, 暖调" maxlength="180"></label><fieldset id="recipe-groups"><legend>配方允许修改的分组</legend><label><input type="checkbox" value="tone" checked>影调</label><label><input type="checkbox" value="whiteBalance">白平衡</label><label><input type="checkbox" value="color" checked>颜色</label><label><input type="checkbox" value="curves" checked>曲线</label><label><input type="checkbox" value="grading" checked>分级</label><label><input type="checkbox" value="style">滤镜</label><label><input type="checkbox" value="beauty">美颜</label><label><input type="checkbox" value="detail">细节</label><label><input type="checkbox" value="effects">效果</label></fieldset><label id="instruction-label">AI 指令 / 局部蒙版 JSON<textarea name="instruction" rows="3" maxlength="20000" placeholder="AI 指令可使用 ${request} 插入用户要求；局部工具填写 LocalMask JSON"></textarea></label><div class="two"><label>授权<select name="licenseType"><option value="free">免费，按作者条款使用</option><option value="openSource">开源</option><option value="commercial">商业授权</option></select></label><label>开源许可<select name="spdx"><option>MIT</option><option>Apache-2.0</option><option>BSD-3-Clause</option><option>CC0-1.0</option><option>CC-BY-4.0</option></select></label></div><label>源码地址（开源作品必填）<input name="sourceURL" type="url" placeholder="https://github.com/..."></label><div class="two"><label>商业价格（元）<input name="price" type="number" min="0.01" max="1000000" step="0.01"></label><label>币种<select name="currency"><option>CNY</option><option>USD</option></select></label></div><label>使用条款<textarea name="terms" required rows="2" maxlength="4000" placeholder="说明个人/商业使用、修改分发与第三方素材授权"></textarea></label></div><label class="check"><input name="rights" type="checkbox" required>我有权发布此作品及所含资源，已说明适用许可。</label><p class="hint">商业作品可展示价格并提供预览。购买、收入结算与分账目前尚未开放。</p><p id="publish-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="download-draft" class="quiet">导出插件包</button><button class="primary" id="publish-submit">验证并发布</button></div></form></dialog>
<dialog id="profile-dialog"><div class="dialog-head"><h2>创作者</h2><button class="close" data-close="profile-dialog" aria-label="关闭创作者">×</button></div><div id="profile-content"></div></dialog>
<script src="/app.js"></script></body></html>
